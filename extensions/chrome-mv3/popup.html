<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vigils</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="header-title">Vigils</div>
    </div>
    <div id="header-status" class="header-status"></div>
  </header>

  <div id="status-bar" class="status-bar">
    <strong id="status-text">检查中</strong>
    <span class="dot">·</span>
    <span id="status-domain">当前页面</span>
  </div>

  <div id="banner" class="banner hidden">
    <span class="banner-icon">🔒</span>
    <div class="banner-text">
      <strong id="banner-domain">example.com</strong>
      <span>未受保护，授权后自动检测敏感内容</span>
    </div>
    <button id="protect-btn" type="button" class="banner-btn">授权</button>
  </div>

  <div class="divider" id="divider"></div>

  <div id="findings-section">
    <div id="fold-header" class="fold-header">
      <div class="fold-header-left">
        <span class="fold-label">事件列表</span>
        <span id="event-count" class="badge hidden">0</span>
      </div>
      <svg id="fold-chevron" class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
    </div>
    <div id="fold-body" class="fold-body">
      <ul id="findings-list" class="event-list hidden" role="list"></ul>
      <div id="empty-state" class="empty-state">
        <div class="empty-state-icon">✅</div>
        <div class="empty-state-title">一切正常</div>
        <div class="empty-state-desc">暂无检测到敏感内容</div>
      </div>
      <div class="clear-btn">
        <button id="clear-btn" type="button" class="clear-btn-inner">清空</button>
      </div>
    </div>
  </div>

  <footer>
    <a id="options-link" href="#">设置</a>
    <span class="privacy">本地检测</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
