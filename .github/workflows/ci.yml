name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # System deps for Tauri / GTK on Linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # gui feature 默认关(workspace 矩阵不覆盖)——guardian(安装/换装/互斥)是发布关键面,
      # 单独开 feature 过 clippy + 测试(系统依赖上方已装;--lib 限定桌面单测,不动集成测试矩阵)。
      - name: Clippy (desktop gui feature)
        run: cargo clippy -p vigil-desktop --features gui --all-targets -- -D warnings

      # ort feature 默认关(同 gui)—— ML 路径此前**从未在 CI 编译过**:卖点功能连编译
      # 错误都无人知晓(ort 钉在 =2.0.0-rc.12、tokenizers 0.20,上游变动不会有任何信号)。
      # `load-dynamic` 意味着编译期不需要 onnxruntime dylib(运行期才 dlopen),所以这里
      # 只编译、不下载任何模型(1.5GB),成本约 3-5 min。真模型 E2E 归 ml-nightly.yml。
      - name: Clippy (ort feature)
        run: cargo clippy -p vigil-redaction -p vigil-firewall -p vigil-mcp --features ort --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (desktop gui feature)
        run: cargo test -p vigil-desktop --features gui --lib

      # 同上:只跑 ort 下**非** ignored 的测试(不需要模型)。刻意**不带** `--ignored` ——
      # 那 7 个要真模型,归 ml-nightly.yml;且 L1(fail-closed 门控)之后,已 opt-in 而
      # 无模型会直接 panic,在主 CI 里跑必红。
      - name: Test (ort feature, non-ignored)
        run: cargo test -p vigil-redaction -p vigil-firewall -p vigil-mcp --features ort

  ui:
    name: Desktop UI (typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  extension:
    name: Extension (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test extensions/chrome-mv3/tests/*.test.mjs

  # 依赖供应链防线(deny.toml):advisories(RUSTSEC)/licenses/bans/sources。
  # 与 rust job 分开跑--cargo-deny 不编译,1-2 分钟出结果,不用等冷编译。
  # 漏洞披露不跟发版节奏走,周跑 cron 另见 deny-advisories.yml。
  cargo-deny:
    name: Cargo deny (advisories / licenses / bans / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 预编译二进制秒装;不用 EmbarkStudios/cargo-deny-action 是因为其
      # arguments 会与内部硬编码的 check 子命令拼接,显式命令行更可读可复现
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --config deny.toml check

  # MSRV 守门:workspace rust-version 声明曾经悄悄失效(1.80 -> 实际需要 1.95),
  # 此 job 用声明的最低版本编译,声明再漂移时当天变红而不是用户报 issue 才发现。
  msrv:
    name: MSRV (rust-version compile check)
    runs-on: ubuntu-latest
    env:
      # MSRV 单一真源:下方工具链 / step name / verify 基准全部引用它。
      # 升 MSRV 只改这里 + Cargo.toml 的 rust-version,两者不一致由 verify 当天判红。
      # 此前版本号散在三处硬编码,而 verify 只比对「声明 vs USED」、不比对
      # 「USED vs 实际 toolchain」—— 改一处漏一处时防漂移会静默失效,
      # 即声明 1.95 却从没真用 1.95 验过。
      MSRV: "1.95"
    steps:
      - uses: actions/checkout@v4

      # 工具链版本取自上面的 env.MSRV,不再散落多处硬编码。
      - name: Install Rust toolchain (${{ env.MSRV }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # check 而非 clippy/test:MSRV 只验证"能编译",门禁语义归 rust job。
      # --all-targets 连 benches/tests 一起验,避免仅 src 过而 dev-deps 不过。
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets

      # 防漂移:Cargo.toml 声明的 rust-version 必须等于本 job 实际用的工具链。
      # 两侧都源于 env.MSRV / Cargo.toml,单一真源,不存在改一处漏一处的缝隙。
      - name: Verify declared rust-version matches
        run: |
          DECLARED=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          USED="${{ env.MSRV }}"
          if [ "$DECLARED" != "$USED" ]; then
            echo "::error::Cargo.toml 声明 rust-version=$DECLARED,但 msrv job 用 $USED。请同步更新。"
            exit 1
          fi
