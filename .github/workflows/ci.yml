name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # System deps for Tauri / GTK on Linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # gui feature 默认关(workspace 矩阵不覆盖)——guardian(安装/换装/互斥)是发布关键面,
      # 单独开 feature 过 clippy + 测试(系统依赖上方已装;--lib 限定桌面单测,不动集成测试矩阵)。
      - name: Clippy (desktop gui feature)
        run: cargo clippy -p vigil-desktop --features gui --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (desktop gui feature)
        run: cargo test -p vigil-desktop --features gui --lib

  ui:
    name: Desktop UI (typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  extension:
    name: Extension (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test extensions/chrome-mv3/tests/*.test.mjs
