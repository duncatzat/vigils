[package]
name = "vigil-desktop"
publish = false  # 非 SDK publish set(app / wasmtime / http / sandbox)— 不上 crates.io;cargo-deny path-dep wildcard 守门
# 单 [[bin]] vigils:desktop crate 只产 GUI 二进制,杜绝双 bin 歧义(v0.1.2 灾难教训)。
# 公开树**不保留** src/main.rs(内部用 autobins=false 排除它,但 tauri-cli 自实现的
# manifest 解析不理解 autobins,会按 cargo 自动发现规则把 src/main.rs 当 crate 名 bin →
# bundler 找 target/release/vigil-desktop 不存在,三平台 bundle 全挂 —— v0.6.0-beta.2 实证)。
default-run = "vigils"  # tauri build 靠此认主二进制(单 bin 下无歧义;bin 名品牌一致 = vigils.exe)
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# GUI bin(Tauri;feature 门控,默认关闭 —— `cargo test --workspace` 不编)。
# desktop crate 仅此一个 bin(无 src/main.rs,无自动发现歧义)。
# v0.11 ISS-102/103/104:bin name 对齐 path basename,Tauri v2 bundle 默认查
# `target/release/<path-basename>` 复制 binary;name == path basename == mainBinaryName
# 三者一致(均 `vigils`)让 bundle 找得到。raw build 用 `--bin vigils --features gui`。
[[bin]]
name = "vigils"
path = "src/bin/vigils.rs"
required-features = ["gui"]

[lib]
name = "vigil_desktop"
path = "src/lib.rs"

# I08b feature matrix:
# - 默认(无 feature):纯 CLI,零 Tauri 依赖,cargo test --workspace 零 regression
# - `gui`:启用 Tauri 2 GUI binary(拉 ~200 transitive crates,仅 `cargo tauri dev` 或
#   `cargo build --features gui` 时触发);v0.5 P1 ADR 0014 α1 起额外拉 vigil-mcp /
#   vigil-firewall / vigil-policy(embed Hub 骨架)。三者全部 optional + dep:* 门控,
#   默认 feature 仍 0 痕迹(`cargo tree --no-default-features` 不出现)。
[features]
default = []
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-single-instance",
    "dep:tokio",
    "dep:dirs",
    "dep:vigil-mcp",
    "dep:vigil-firewall",
    "dep:vigil-policy",
    "dep:ureq",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
    "dep:minisign-verify",
    "dep:base64",
]

[dependencies]
vigil-types = { path = "../../crates/vigil-types" }
vigil-ui-protocol = { path = "../../crates/vigil-ui-protocol" }
vigil-audit = { path = "../../crates/vigil-audit" }
vigil-runner = { path = "../../crates/vigil-runner", default-features = false }
# 扩展体系 Phase 2「策略+观测」:Protection Overview 浏览器防线卡直调 install::status
# (注册态,纯文件/注册表只读)—— 复用 host 自身的路径推导,不 shell、不解析人类文本。
vigil-native-host = { path = "../native-host" }
# v0.5 P1 ADR 0014 α1:GUI bin embed Hub 骨架(默认关闭;features = ["gui"] 拉)。
# `vigil-firewall.default-features = false`:防默认拉 ort feature(ISS-008 P2 模型路径,
# 启动 ~7s cold-start;GUI α1 无需 PiiScanner=ort,Firewall::new 走 NoopEngine)。
vigil-mcp = { path = "../../crates/vigil-mcp", optional = true }
vigil-firewall = { path = "../../crates/vigil-firewall", optional = true, default-features = false }
vigil-policy = { path = "../../crates/vigil-policy", optional = true }
clap = { workspace = true }
# gui.rs 用 `#[derive(serde::Serialize)]`;serde_json 不等于 serde namespace
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

# I08b(feature `gui`):Tauri 2 GUI 栈,optional 避免默认拉
tauri = { version = "2", optional = true, default-features = false, features = ["wry", "tray-icon"] }
# 单实例守卫(多开根治):再次启动唤起首实例主窗口而非起新进程。optional,仅 gui feature 拉。
tauri-plugin-single-instance = { version = "2", optional = true }
tokio = { workspace = true, optional = true }
# β5:用户数据目录解析(跨平台);仅 gui feature 需要,运行时定位 ledger 持久化路径
dirs = { version = "6", optional = true }
# ③ 引擎自动下载(gui):缺 vigil-hub 时从发布镜像拉取。轻量 blocking HTTP(rustls)。
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
# ③.5 ML 引擎变体安装(gui):解包发布的 `vigil-cli-ml-*.tar.gz`(--features ort 的 vigil-hub +
# 同目录 ONNX Runtime dylib)。flate2 已在 workspace lock(纯 Rust miniz_oxide 后端,无 C 工具链);
# tar 纯 Rust。仅 gui feature 拉,默认硬指纹分发零痕迹。
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# 真公开 Windows ML 资产是 .zip(Unix 是 .tar.gz)→ 解包器按魔数嗅探两种格式。
# default-features=false + deflate(flate2/miniz,纯 Rust)→ 不拉 bzip2/zstd 等 C 依赖。
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
# 签名引擎清单验签:复用 Tauri 更新器同款 minisign key 验发版期签名的 engine-manifest.json(SHA 信任锚)。
# minisign-verify 纯 Rust 仅验签;base64 解 Tauri 包装的 .sig(其内容 = base64(标准 minisign 文本))。
minisign-verify = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true, default-features = false , features = [] }

[dev-dependencies]
tempfile = { workspace = true }
vigil-lease = { path = "../../crates/vigil-lease" }
rusqlite = { workspace = true }
# 仅测试:在测试内现造 minisign 风格预哈希签名,hermetic 验证 verify_minisign(无外部工具/网络)。
ed25519-dalek = "2"
blake2 = "0.10"
