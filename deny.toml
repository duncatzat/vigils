# cargo-deny 配置(依赖供应链防线)
# 本地: cargo deny check
# CI:  .github/workflows/ci.yml 的 cargo-deny job + deny-advisories weekly cron
#
# 策略(与仓库安全姿态对齐,fail-closed 但允许显式豁免):
# - advisories: 漏洞级别 RUSTSEC 一票否决;unmaintained 仅告警(先观察存量)
# - licenses:   只允许宽松 license;GPL/AGPL/SSPL 等一票否决(本项目 Apache-2.0)
# - bans:       多版本/重复依赖与 wildcard 仅告警(存量 reqwest 0.12/0.13 分叉
#               已在治理清单;wildcard 均为内部 path 依赖无版本号)
# - sources:    仅允许 crates.io + 本地 path(防供应链投毒)

# all-features=true:审计面必须覆盖**全部发货产物**,而不止默认 feature 矩阵——
# ML 变体(vigils-cli-ml-*,--features ort)与桌面 GUI(.deb/.msi/.dmg,--features gui)
# 自 v0.4.0 起随每个 release 发布,其依赖树(ort/tokenizers、tauri/gtk)若不进图,
# 已发货面的新漏洞不会红。代价是 tauri Linux 栈的 gtk3 unmaintained 系列需显式豁免
# (见 advisories.ignore,均为 unmaintained 类而非漏洞类;真 gtk3 CVE 是新 ID,照常拦)。
[graph]
all-features = true

# ---------------------------------------------------------------- advisories
[advisories]
version = 2
# RUSTSEC 漏洞:deny(发现即红);豁免走下方 ignore 列表并注明理由与解禁条件
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

# 已知且接受的 advisory 在此登记(每条必须带理由 + 复查时间):
ignore = [
  # rsa:dev-only 测试夹具(vigil-http-transport e2e_real_tls.rs 的 RS256 round-trip;
  # rcgen 的 ring 后端不支持 RSA 生成,故引入)。Marvin Attack 是网络可观测的
  # 时序侧信道,本地测试密钥生成不适用;无安全升级版本(rsa 0.9 系全受影响)。
  # 复查:若 rcgen 支持非 RSA 的 RS256 测试路径或该测试下线,移除此豁免。
  { id = "RUSTSEC-2023-0071", reason = "dev-only test fixture for RS256 round-trip; timing side-channel N/A to local keygen; no safe upgrade exists" },
  # rustls-pemfile:dev-only TLS 测试夹具读 PEM。上游已归档,迁移路径是
  # rustls-pki-types::pem::PemObject(1.9+)。生产树不受影响。
  # 复查:迁移测试夹具到 PemObject 后移除。
  { id = "RUSTSEC-2025-0134", reason = "dev-only TLS test fixture; upstream archived, migration to rustls-pki-types PemObject tracked as follow-up" },

  # ── gtk-rs GTK3 绑定 unmaintained 系列(8 条):tauri 2 的 Linux 栈(tao/wry →
  # gtk/gdk/atk 0.18)仍基于 GTK3,gtk-rs 上游已转向 GTK4 并停止维护 GTK3 绑定。
  # unmaintained 类 ≠ 漏洞;真 GTK3 CVE 会以新 RUSTSEC ID 披露,不受此豁免影响。
  # 无本仓可行动的升级路径(需 tauri 上游迁移)。复查:tauri 发布 GTK4 栈后移除。
  { id = "RUSTSEC-2024-0411", reason = "unmaintained-class; gtk3 bindings via tauri 2 Linux stack (tao); no action until tauri migrates to gtk4" },
  { id = "RUSTSEC-2024-0412", reason = "unmaintained-class; gtk3 bindings via tauri 2 Linux stack; no action until tauri migrates to gtk4" },
  { id = "RUSTSEC-2024-0413", reason = "unmaintained-class; gtk3 bindings via tauri 2 Linux stack; no action until tauri migrates to gtk4" },
  { id = "RUSTSEC-2024-0415", reason = "unmaintained-class; gtk3 bindings via tauri 2 Linux stack; no action until tauri migrates to gtk4" },
  { id = "RUSTSEC-2024-0416", reason = "unmaintained-class; gtk3 bindings via tauri 2 Linux stack; no action until tauri migrates to gtk4" },
  { id = "RUSTSEC-2024-0418", reason = "unmaintained-class; gtk3 bindings via tauri 2 Linux stack; no action until tauri migrates to gtk4" },
  { id = "RUSTSEC-2024-0419", reason = "unmaintained-class; gtk3-macros via tauri 2 Linux stack; no action until tauri migrates to gtk4" },
  { id = "RUSTSEC-2024-0420", reason = "unmaintained-class; gtk3-sys via tauri 2 Linux stack; no action until tauri migrates to gtk4" },
  # proc-macro-error:glib-macros(gtk3 栈)传递依赖,同上 tauri 上游问题。
  { id = "RUSTSEC-2024-0370", reason = "unmaintained-class; via glib-macros in tauri gtk3 stack; same review condition as gtk3 series" },
  # paste:tokenizers(ort/ML 面)传递依赖;unmaintained 类,宏 crate 无运行时面。
  # 复查:tokenizers 升级换掉 paste 后移除。
  { id = "RUSTSEC-2024-0436", reason = "unmaintained-class; proc-macro only (no runtime surface) via tokenizers; remove when tokenizers drops paste" },
  # unic-* 系列(5 条):tauri-utils 传递依赖;unmaintained 类,Unicode 数据表 crate。
  # 复查:tauri-utils 换用维护中的 Unicode 实现后移除。
  { id = "RUSTSEC-2025-0075", reason = "unmaintained-class; unicode data tables via tauri-utils; remove when tauri-utils migrates" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained-class; unicode data tables via tauri-utils; remove when tauri-utils migrates" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained-class; unicode data tables via tauri-utils; remove when tauri-utils migrates" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained-class; unicode data tables via tauri-utils; remove when tauri-utils migrates" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained-class; unicode data tables via tauri-utils; remove when tauri-utils migrates" },
]

# ---------------------------------------------------------------- licenses
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",          # Tauri 系依赖;文件级 copyleft,二进制分发可接受
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "0BSD",
]
# 置信度阈值:license 识别不确定时报出来人工裁决,不静默放行
confidence-threshold = 0.93

# ---------------------------------------------------------------- bans
[bans]
# 存量多版本(reqwest 0.12/0.13 等)先 warn 观察升级路径,不阻塞 CI;
# 治理完成后可改为 deny
multiple-versions = "warn"
highlight = "all"
# 内部 path 依赖未带 version 字段会被判 wildcard(全部 8 处均为 workspace 内部
# 引用,无外部 wildcard)。后续给 path 依赖补 version 后可升回 deny。
wildcards = "warn"

# ---------------------------------------------------------------- sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
